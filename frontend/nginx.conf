# nginx.conf — adapté du template canonique (core-platform/core-platform/templates/nginx.conf).
#
# Adaptation machine (/srv/team10/CLAUDE.md §2/§3) : front et API sont sur la
# même origine via le proxy d'entrée, et les assets passeront par l'API, jamais
# par un accès direct au magasin d'objets — donc connect-src/img-src ne
# référencent que 'self', pas de port ni d'origine externe pour l'API/S3.
#
# ⚠ nginx : dès qu'une `location` déclare un `add_header`, elle n'hérite plus
# des `add_header` du niveau `server` — les en-têtes de sécurité sont donc
# répétés dans chaque location qui fixe un Cache-Control.
server {
  listen 80;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; frame-ancestors 'none'" always;
  # HSTS : à activer uniquement derrière TLS (production) — pas de TLS sur la machine du hackathon
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location / { try_files $uri $uri/ /index.html; }
}
